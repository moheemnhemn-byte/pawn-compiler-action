name: Compile MihanRP

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract MihanRP
        run: |
          unzip -o mihanrp-master.zip
          echo "Searching for mxINI..."
          find mihanrp-master -iname "mxini.inc" -o -iname "mxini"

      - name: Fix mxINI filename
        run: |
          FILE=$(find mihanrp-master/pawno/include -iname "mxini.inc" | head -n 1)
          if [ -n "$FILE" ]; then
            cp "$FILE" mihanrp-master/pawno/include/mxini.inc
          else
            echo "mxini.inc not found"
            exit 1
          fi

      - name: Compile new.pwn
        uses: knryuu/pawn-compiler-action@v1
        with:
          input: mihanrp-master/gamemodes/new.pwn
          output: mihanrp-master/gamemodes/new.amx
          includes: mihanrp-master/pawno/include

      - name: Upload new.amx
        uses: actions/upload-artifact@v4
        with:
          name: NAVARA-new-amx
          path: mihanrp-master/gamemodes/new.amx
