name: Compile NAVARA MihanRP

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:

      # 1 - تحميل المشروع
      - name: Checkout
        uses: actions/checkout@v4

      # 2 - فك ملف MihanRP
      - name: Extract MihanRP
        shell: bash
        run: |
          set -e

          unzip -o mihanrp-master.zip -d extracted

          echo "===== PROJECT FILES ====="
          find extracted -maxdepth 4 -type f | head -300

      # 3 - تحديد مجلد المشروع
      - name: Detect project folder
        shell: bash
        run: |
          set -e

          PROJECT_FILE=$(find extracted -type f -name "new.pwn" -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: new.pwn was not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$PROJECT_FILE")")

          echo "PROJECT_FILE=$PROJECT_FILE"
          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 4 - فحص المشروع
      - name: Check project
        shell: bash
        run: |
          set -e

          echo "===== new.pwn ====="
          find "$PROJECT_DIR" -type f -name "new.pwn"

          echo ""
          echo "===== INCLUDE FILES ====="
          find "$PROJECT_DIR" -type f \
            \( -iname "*.inc" -o -iname "*.pwn" \) \
            | sort

      # 5 - إصلاح mxINI
      - name: Fix mxINI include
        shell: bash
        run: |
          set -e

          INCLUDE_DIR="$PROJECT_DIR/pawno/include"

          if [ ! -d "$INCLUDE_DIR" ]; then
            echo "ERROR: pawno/include not found!"
            exit 1
          fi

          FILE=$(find "$INCLUDE_DIR" \
            -type f \
            -iname "mxini.inc" \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "ERROR: mxINI.inc was not found!"
            exit 1
          fi

          echo "Found:"
          echo "$FILE"

          cp "$FILE" "$INCLUDE_DIR/mxini.inc"

          echo "mxini.inc created successfully."

      # 6 - إصلاح اختلاف أحرف أسماء الـincludes
      - name: Fix include filename case
        shell: bash
        run: |
          set -e

          INCLUDE_DIR="$PROJECT_DIR/pawno/include"

          echo "Normalizing include filenames..."

          find "$INCLUDE_DIR" -type f -iname "*.inc" | while read -r FILE
          do
            BASE=$(basename "$FILE")
            LOWER=$(echo "$BASE" | tr '[:upper:]' '[:lower:]')

            if [ "$BASE" != "$LOWER" ]; then
              TARGET="$INCLUDE_DIR/$LOWER"

              if [ ! -f "$TARGET" ]; then
                cp "$FILE" "$TARGET"
                echo "Created: $TARGET"
              fi
            fi
          done

      # 7 - تثبيت الأدوات
      - name: Install build tools
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            cmake \
            gcc \
            g++ \
            make \
            gcc-multilib \
            g++-multilib \
            unzip

      # 8 - تحميل Pawn Compiler الرسمي
      - name: Download Pawn Compiler
        shell: bash
        run: |
          set -e

          git clone \
            --depth 1 \
            --branch v3.10.11 \
            https://github.com/openmultiplayer/compiler.git \
            pawn-compiler

      # 9 - بناء Pawn Compiler
      - name: Build Pawn Compiler
        shell: bash
        run: |
          set -e

          cd pawn-compiler

          mkdir -p build

          cd build

          cmake ../source/compiler \
            -DCMAKE_C_FLAGS="-m32" \
            -DCMAKE_BUILD_TYPE=Release

          make -j2

          echo "===== COMPILER FILES ====="

          find . \
            -type f \
            \( -name "pawncc" -o -name "pawncc.exe" \) \
            -print

      # 10 - تحديد مكان pawncc
      - name: Locate pawncc
        shell: bash
        run: |
          set -e

          PAWNCC=$(find "$GITHUB_WORKSPACE/pawn-compiler" \
            -type f \
            -name "pawncc" \
            -perm -111 \
            -print -quit)

          if [ -z "$PAWNCC" ]; then
            echo "ERROR: pawncc was not built!"
            exit 1
          fi

          chmod +x "$PAWNCC"

          echo "Pawn compiler:"
          echo "$PAWNCC"

          echo "PAWNCC=$PAWNCC" >> "$GITHUB_ENV"

      # 11 - تجميع new.pwn
      - name: Compile new.pwn
        shell: bash
        run: |
          set -e

          INPUT="$PROJECT_DIR/gamemodes/new.pwn"
          OUTPUT="$PROJECT_DIR/gamemodes/new.amx"
          INCLUDE="$PROJECT_DIR/pawno/include"

          if [ ! -f "$INPUT" ]; then
            echo "ERROR: new.pwn not found!"
            exit 1
          fi

          echo "===================================="
          echo "Compiling NAVARA / MihanRP"
          echo "===================================="

          echo "Input:"
          echo "$INPUT"

          echo "Output:"
          echo "$OUTPUT"

          echo "Include:"
          echo "$INCLUDE"

          "$PAWNCC" \
            -d3 \
            -Z \
            "-i$INCLUDE" \
            "-o$OUTPUT" \
            "$INPUT"

      # 12 - التأكد من إنشاء AMX
      - name: Verify AMX
        shell: bash
        run: |
          set -e

          AMX="$PROJECT_DIR/gamemodes/new.amx"

          if [ ! -f "$AMX" ]; then
            echo "ERROR: new.amx was NOT created!"
            exit 1
          fi

          SIZE=$(stat -c%s "$AMX")

          echo "===================================="
          echo "SUCCESS!"
          echo "===================================="
          echo "new.amx created successfully."
          echo "Size: $SIZE bytes"

          if [ "$SIZE" -lt 1000 ]; then
            echo "ERROR: AMX file is suspiciously small!"
            exit 1
          fi

            # 13 - رفع new.amx
      - name: Upload new.amx
        uses: actions/upload-artifact@v4
        with:
          name: NAVARA-new-amx
          path: extracted/mihanrp-master/gamemodes/new.amx
          if-no-files-found: error
              
