name: Compile MihanRP

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract MihanRP
        run: |
          unzip -o mihanrp-master.zip
          find mihanrp-master/pawno/include -iname "mxini.inc" -exec cp {} mihanrp-master/pawno/include/mxini.inc \;

      - name: Download Pawn Compiler
        run: |
          wget -q https://github.com/openmultiplayer/compiler/releases/download/v3.10.11/pawn-compiler-linux.tar.gz
          tar -xzf pawn-compiler-linux.tar.gz

      - name: Compile
        run: |
          chmod +x pawncc
          ./pawncc \
            "mihanrp-master/gamemodes/new.pwn" \
            -o"mihanrp-master/gamemodes/new.amx" \
            -i"mihanrp-master/pawno/include" \
            -d3 \
            -Z

      - name: Upload AMX
        uses: actions/upload-artifact@v4
        with:
          name: NAVARA-new-amx
          path: mihanrp-master/gamemodes/new.amx
