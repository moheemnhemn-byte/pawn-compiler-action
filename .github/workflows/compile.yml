name: Compile NAVARA MihanRP

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. تحميل المشروع
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. فك مشروع MihanRP
      # ==========================================
      - name: Extract MihanRP
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo "EXTRACTING PROJECT"
          echo "===================================="

          rm -rf extracted
          mkdir -p extracted

          unzip -o mihanrp-master.zip -d extracted

          echo ""
          echo "Project extracted successfully."

      # ==========================================
      # 3. العثور على new.pwn
      # ==========================================
      - name: Detect project
        shell: bash
        run: |
          set -e

          PROJECT_FILE=$(find extracted -type f -name "new.pwn" -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: new.pwn was NOT found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$PROJECT_FILE")")

          echo "===================================="
          echo "PROJECT DETECTED"
          echo "===================================="
          echo "Source:"
          echo "$PROJECT_FILE"
          echo ""
          echo "Project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_FILE=$PROJECT_FILE" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # 4. التأكد من ملفات المشروع
      # ==========================================
      - name: Check project
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo "CHECKING PROJECT"
          echo "===================================="

          if [ ! -f "$PROJECT_FILE" ]; then
            echo "ERROR: new.pwn missing!"
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/pawno/include" ]; then
            echo "ERROR: pawno/include missing!"
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/gamemodes" ]; then
            echo "ERROR: gamemodes folder missing!"
            exit 1
          fi

          echo "new.pwn: OK"
          echo "pawno/include: OK"
          echo "gamemodes: OK"

      # ==========================================
      # 5. إصلاح mxINI
      # ==========================================
      - name: Fix mxINI include
        shell: bash
        run: |
          set -e

          INCLUDE_DIR="$PROJECT_DIR/pawno/include"

          FILE=$(find "$INCLUDE_DIR" \
            -type f \
            -iname "mxini.inc" \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "ERROR: mxINI.inc was NOT found!"
            exit 1
          fi

          echo "Found:"
          echo "$FILE"

          cp "$FILE" "$INCLUDE_DIR/mxini.inc"

          echo "mxini.inc created."

      # ==========================================
      # 6. إصلاح أسماء الـIncludes
      # ==========================================
      - name: Normalize include names
        shell: bash
        run: |
          set -e

          INCLUDE_DIR="$PROJECT_DIR/pawno/include"

          echo "Normalizing include names..."

          find "$INCLUDE_DIR" \
            -type f \
            -iname "*.inc" \
            | while read -r FILE
          do
            BASE=$(basename "$FILE")
            LOWER=$(printf '%s' "$BASE" | tr '[:upper:]' '[:lower:]')

            if [ "$BASE" != "$LOWER" ]; then

              TARGET="$INCLUDE_DIR/$LOWER"

              if [ ! -f "$TARGET" ]; then
                cp "$FILE" "$TARGET"
                echo "Created: $LOWER"
              fi

            fi
          done

          echo "Include normalization finished."

      # ==========================================
      # 7. تحميل Pawn Compiler 3.10.10
      # ==========================================
      - name: Install Pawn Compiler 3.10.10
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo "INSTALLING PAWN COMPILER 3.10.10"
          echo "===================================="

          PAWN_ROOT="$RUNNER_TEMP/pawn"

          rm -rf "$PAWN_ROOT"
          mkdir -p "$PAWN_ROOT"

          cd "$PAWN_ROOT"

          wget -q \
            "https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-linux.tar.gz" \
            -O pawnc.tar.gz

          echo "Compiler downloaded."

          tar -xzf pawnc.tar.gz

          COMPILER_DIR="$PAWN_ROOT/pawnc-3.10.10-linux"

          if [ ! -f "$COMPILER_DIR/bin/pawncc" ]; then
            echo "ERROR: pawncc not found!"
            exit 1
          fi

          if [ ! -f "$COMPILER_DIR/lib/libpawnc.so" ]; then
            echo "ERROR: libpawnc.so not found!"
            exit 1
          fi

          chmod +x "$COMPILER_DIR/bin/pawncc"

          echo ""
          echo "===================================="
          echo "COMPILER FILES"
          echo "===================================="

          ls -lah "$COMPILER_DIR/bin"
          ls -lah "$COMPILER_DIR/lib"

          echo ""
          echo "===================================="
          echo "CHECKING LIBRARY"
          echo "===================================="

          ldd "$COMPILER_DIR/bin/pawncc" || true

          echo ""
          echo "===================================="
          echo "TESTING PAWNCC"
          echo "===================================="

          export LD_LIBRARY_PATH="$COMPILER_DIR/lib"

          set +e

          "$COMPILER_DIR/bin/pawncc" > "$RUNNER_TEMP/pawncc_test.txt" 2>&1

          TEST_CODE=$?

          set -e

          cat "$RUNNER_TEMP/pawncc_test.txt"

          # 127 = library/command loading failure
          # 139 = segmentation fault
          if [ "$TEST_CODE" -eq 127 ]; then
            echo ""
            echo "ERROR: pawncc could not load libpawnc.so!"
            exit 1
          fi

          if [ "$TEST_CODE" -eq 139 ]; then
            echo ""
            echo "ERROR: pawncc crashed!"
            exit 1
          fi

          echo ""
          echo "Pawn compiler loaded successfully."

          echo "PAWNCC=$COMPILER_DIR/bin/pawncc" >> "$GITHUB_ENV"
          echo "PAWN_LIB=$COMPILER_DIR/lib" >> "$GITHUB_ENV"

      # ==========================================
      # 8. Compile new.pwn
      # ==========================================
      - name: Compile new.pwn
        shell: bash
        run: |
          set -e

          export LD_LIBRARY_PATH="$PAWN_LIB"

          echo "===================================="
          echo "COMPILING NAVARA"
          echo "===================================="

          echo ""
          echo "Compiler:"
          echo "$PAWNCC"

          echo ""
          echo "Source:"
          echo "$PROJECT_FILE"

          echo ""
          echo "Include:"
          echo "$PROJECT_DIR/pawno/include"

          echo ""

          cd "$PROJECT_DIR/gamemodes"

          rm -f new.amx

          "$PAWNCC" \
            "$PROJECT_FILE" \
            "-i$PROJECT_DIR/pawno/include" \
            "-D$PROJECT_DIR/gamemodes" \
            "-Z" \
            "-d3" \
            "-O2"

          echo ""
          echo "===================================="
          echo "COMPILER FINISHED"
          echo "===================================="

      # ==========================================
      # 9. التأكد من إنشاء AMX
      # ==========================================
      - name: Verify AMX
        shell: bash
        run: |
          set -e

          AMX="$PROJECT_DIR/gamemodes/new.amx"

          echo "===================================="
          echo "VERIFYING NEW.AMX"
          echo "===================================="

          if [ ! -f "$AMX" ]; then
            echo ""
            echo "ERROR: new.amx was NOT created!"
            echo ""
            echo "Gamemodes files:"
            ls -lah "$PROJECT_DIR/gamemodes"
            exit 1
          fi

          SIZE=$(stat -c%s "$AMX")

          echo ""
          echo "new.amx FOUND!"
          echo "Size: $SIZE bytes"

          if [ "$SIZE" -lt 1000 ]; then
            echo ""
            echo "ERROR: AMX file is too small!"
            exit 1
          fi

          echo ""
          echo "===================================="
          echo "SUCCESS"
          echo "===================================="
          echo ""
          echo "NAVARA new.amx created successfully!"

      # ==========================================
      # 10. رفع AMX
      # ==========================================
      - name: Upload new.amx
        uses: actions/upload-artifact@v4
        with:
          name: NAVARA-new-amx
          path: ${{ env.PROJECT_DIR }}/gamemodes/new.amx
