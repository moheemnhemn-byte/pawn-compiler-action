name: Compile NAVARA MihanRP

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:

      # 1 - تحميل المشروع
      - name: Checkout
        uses: actions/checkout@v4

      # 2 - فك ملف MihanRP
      - name: Extract MihanRP
        shell: bash
        run: |
          set -e

          unzip -o mihanrp-master.zip -d extracted

          echo "===== PROJECT FILES ====="
          find extracted -maxdepth 4 -type f | head -300

      # 3 - تحديد مجلد المشروع
      - name: Detect project folder
        shell: bash
        run: |
          set -e

          PROJECT_FILE=$(find extracted -type f -name "new.pwn" -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: new.pwn was not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$PROJECT_FILE")")

          echo "PROJECT_FILE=$PROJECT_FILE"
          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 4 - فحص المشروع
      - name: Check project
        shell: bash
        run: |
          set -e

          echo "===== new.pwn ====="
          find "$PROJECT_DIR" -type f -name "new.pwn"

          echo ""
          echo "===== INCLUDE FILES ====="
          find "$PROJECT_DIR" -type f \
            \( -iname "*.inc" -o -iname "*.pwn" \) \
            | sort

      # 5 - إصلاح mxINI
      - name: Fix mxINI include
        shell: bash
        run: |
          set -e

          INCLUDE_DIR="$PROJECT_DIR/pawno/include"

          if [ ! -d "$INCLUDE_DIR" ]; then
            echo "ERROR: pawno/include not found!"
            exit 1
          fi

          FILE=$(find "$INCLUDE_DIR" \
            -type f \
            -iname "mxini.inc" \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "ERROR: mxINI.inc was not found!"
            exit 1
          fi

          echo "Found:"
          echo "$FILE"

          cp "$FILE" "$INCLUDE_DIR/mxini.inc"

          echo "mxini.inc created successfully."

      # 6 - إصلاح اختلاف أسماء الـincludes
      - name: Fix include filename case
        shell: bash
        run: |
          set -e

          INCLUDE_DIR="$PROJECT_DIR/pawno/include"

          echo "Normalizing include filenames..."

          find "$INCLUDE_DIR" -type f -iname "*.inc" | while read -r FILE
          do
            BASE=$(basename "$FILE")
            LOWER=$(echo "$BASE" | tr '[:upper:]' '[:lower:]')

            if [ "$BASE" != "$LOWER" ]; then
              TARGET="$INCLUDE_DIR/$LOWER"

              if [ ! -f "$TARGET" ]; then
                cp "$FILE" "$TARGET"
                echo "Created: $TARGET"
              fi
            fi
          done

      # 7 - تثبيت Wine
      - name: Install Wine
        shell: bash
        run: |
          set -e

          sudo dpkg --add-architecture i386

          sudo apt-get update

          sudo apt-get install -y \
            wine64 \
            wine32 \
            unzip

          wine --version

      # 8 - التأكد من وجود Compiler الأصلي
      - name: Check original Pawn compiler
        shell: bash
        run: |
          set -e

          PAWNCC="$PROJECT_DIR/pawno/pawncc.exe"

          if [ ! -f "$PAWNCC" ]; then
            echo "ERROR: pawncc.exe was not found!"
            echo ""
            echo "Expected:"
            echo "$PAWNCC"
            echo ""
            echo "Searching for pawncc.exe:"
            find "$PROJECT_DIR" -iname "pawncc.exe" -print
            exit 1
          fi

          echo "===================================="
          echo "Original MihanRP Pawn Compiler found"
          echo "===================================="
          echo "$PAWNCC"

          echo "PAWNCC=$PAWNCC" >> "$GITHUB_ENV"

      # 9 - تجميع new.pwn باستخدام pawncc.exe الأصلي
      - name: Compile new.pwn
        shell: bash
        run: |
          set -e

          INPUT="$PROJECT_DIR/gamemodes/new.pwn"
          OUTPUT="$PROJECT_DIR/gamemodes/new.amx"
          INCLUDE="$PROJECT_DIR/pawno/include"

          if [ ! -f "$INPUT" ]; then
            echo "ERROR: new.pwn not found!"
            exit 1
          fi

          echo "===================================="
          echo "Compiling NAVARA / MihanRP"
          echo "===================================="

          echo "Compiler:"
          echo "$PAWNCC"

          echo "Input:"
          echo "$INPUT"

          echo "Output:"
          echo "$OUTPUT"

          echo "Include:"
          echo "$INCLUDE"

          cd "$PROJECT_DIR/pawno"

          wine "$PAWNCC" \
            "$INPUT" \
            "-o$OUTPUT" \
            "-i$INCLUDE" \
            "-d3" \
            "-Z"

      # 10 - التأكد من إنشاء AMX
      - name: Verify AMX
        shell: bash
        run: |
          set -e

          AMX="$PROJECT_DIR/gamemodes/new.amx"

          if [ ! -f "$AMX" ]; then
            echo "ERROR: new.amx was NOT created!"
            exit 1
          fi

          SIZE=$(stat -c%s "$AMX")

          echo "===================================="
          echo "SUCCESS!"
          echo "===================================="

          echo "new.amx created successfully."
          echo "Size: $SIZE bytes"

          if [ "$SIZE" -lt 1000 ]; then
            echo "ERROR: AMX file is suspiciously small!"
            exit 1
          fi

      # 11 - رفع new.amx
      - name: Upload new.amx
        uses: actions/upload-artifact@v4
        with:
          name: NAVARA-new-amx
          path: extracted/mihanrp-master/gamemodes/new.amx
          if-no-files-found: error
