name: Compile MihanRP

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract MihanRP
        run: |
          unzip -o mihanrp-master.zip
          echo "Files extracted:"
          ls -la mihanrp-master/gamemodes

      - name: Compile new.pwn
        id: compiler
        uses: knryuu/pawn-compiler-action@v1
        with:
          input: mihanrp-master/gamemodes/new.pwn
          output: mihanrp-master/gamemodes/new.amx
          includes: mihanrp-master/pawno/include

      - name: Upload new.amx
        uses: actions/upload-artifact@v4
        with:
          name: NAVARA-new-amx
          path: mihanrp-master/gamemodes/new.amx
